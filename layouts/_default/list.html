{{ define "main" }}
<header>
  <h1>{{ .Title }}</h1>
  {{ with .Description }}<p class="lead">{{ . }}</p>{{ end }}
</header>

{{ .Content }}

<section class="card-grid">
  {{ range .Pages.ByDate.Reverse }}
    <article class="card">
      <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
      {{ with .Description }}<p>{{ . }}</p>{{ end }}
      {{ with .Date }}<small>{{ .Format "2006-01-02" }}</small>{{ end }}
    </article>
  {{ end }}
</section>
{{ end }}
