<!doctype html>
<html lang="{{ site.Language.LanguageCode | default "en" }}">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  {{ partial "header.html" . }}

  <main class="container">
    {{ block "main" . }}{{ end }}
  </main>

  {{ partial "footer.html" . }}
  {{ $js := resources.Get "js/main.js" | minify | fingerprint }}
  <script
    src="{{ $js.RelPermalink }}"
    integrity="{{ $js.Data.Integrity }}"
    crossorigin="anonymous"
  ></script>
</body>
</html>
