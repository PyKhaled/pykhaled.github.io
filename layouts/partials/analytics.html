{{ with site.Params.analytics.googleMeasurementID }}
{{ if hugo.IsProduction }}
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id={{ . }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];

  function gtag() {
    dataLayer.push(arguments);
  }

  gtag("js", new Date());
  gtag("config", "{{ . }}", {
    send_page_view: true
  });
</script>
{{ end }}
{{ end }}
