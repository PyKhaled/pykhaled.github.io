<footer class="site-footer">
  <div class="container">
    <p>© {{ now.Year }} {{ site.Params.author }}.</p>
    <p class="footer-links">
      {{ range site.Data.social }}
      <a href="{{ .url }}" rel="me noopener">{{ .label }}</a>
      {{ end }}
      <a href="{{ "/privacy/" | relURL }}">Privacy</a>
      <a href="{{ "/index.xml" | relURL }}">RSS</a>
    </p>
  </div>
</footer>
