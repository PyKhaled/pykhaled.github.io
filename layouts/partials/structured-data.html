{{ if .IsHome }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": {{ site.Params.author | jsonify }},
  "url": {{ site.BaseURL | jsonify }},
  "jobTitle": "Software Engineer",
  "sameAs": [
    {{ site.Params.github | jsonify }},
    {{ site.Params.medium | jsonify }},
    {{ site.Params.linkedin | jsonify }}
  ]
}
</script>
{{ else if and .IsPage (eq .Section "blog") }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BlogPosting",
  "headline": {{ .Title | jsonify }},
  "description": {{ (.Description | default site.Params.description) | jsonify }},
  "datePublished": {{ .Date.Format "2006-01-02T15:04:05Z07:00" | jsonify }},
  "author": {
    "@type": "Person",
    "name": {{ site.Params.author | jsonify }}
  },
  "mainEntityOfPage": {{ .Permalink | jsonify }}
}
</script>
{{ end }}
